name: city_revival_app
description: "Official mobile application for City Revival AG Church, Tiruchirappalli, Tamil Nadu, India. Led by Senior Pastor Rev. Dr. Jerry Daniel."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'
  flutter: ">=3.19.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.5.1

  # Backend & Network
  supabase_flutter: ^2.5.6
  dio: ^5.4.3+1
  http: ^1.2.1

  # Media & Viewers
  youtube_player_flutter: ^9.0.1
  flutter_pdfview: ^1.3.2
  cached_network_image: ^3.3.1

  # System & Hardware Integrations
  url_launcher: ^6.3.0
  share_plus: ^9.0.0
  path_provider: ^2.1.3
  shared_preferences: ^2.2.3
  flutter_local_notifications: ^17.1.2
  timezone: ^0.9.3

  # UI & Styling
  google_fonts: ^6.2.1
  font_awesome_flutter: ^10.7.0
  shimmer: ^3.0.0
  intl: '>=0.19.0 <1.0.0'

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

# Pin app_links to last version before the flutter.* Gradle property regression.
# app_links >=6.4.0 uses flutter.compileSdkVersion in its Android build.gradle,
# which is only available in the app module and crashes as a library sub-project.
dependency_overrides:
  app_links: 6.3.3

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
