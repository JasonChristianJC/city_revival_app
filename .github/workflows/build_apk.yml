name: Build City Revival AG Church APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-apk:
    name: Build Release APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      # 1. Check out repository code
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. Set up Java 17 (required by Android Gradle plugin)
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # 3. Set up Flutter stable
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.1'
          channel: 'stable'
          cache: true

      # 4. Set up Android SDK
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      # 5. Write android/local.properties with correct SDK path
      - name: Create android/local.properties
        run: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" > android/local.properties
          echo "flutter.sdk=$(which flutter | sed 's|/bin/flutter||')" >> android/local.properties
          cat android/local.properties

      # 6. Confirm Flutter version
      - name: Flutter Version Info
        run: flutter --version

      # 7. Install pub dependencies
      - name: flutter pub get
        run: flutter pub get

      # 8. Patch app_links Gradle build script (belt-and-suspenders)
      # app_links >=6.4.0 references flutter.compileSdkVersion which is only
      # available in the app module. Replace with hardcoded values if present.
      - name: Patch app_links Gradle if needed
        run: |
          find $HOME/.pub-cache -name "build.gradle" -path "*/app_links-*/android/build.gradle" | while read f; do
            if grep -q 'flutter\.compileSdkVersion\|flutter\.targetSdkVersion\|flutter\.minSdkVersion' "$f"; then
              echo "Patching $f ..."
              sed -i \
                -e 's/flutter\.compileSdkVersion/34/g' \
                -e 's/flutter\.targetSdkVersion/34/g' \
                -e 's/flutter\.minSdkVersion/21/g' \
                "$f"
              echo "Patched content:"
              cat "$f"
            else
              echo "$f — no flutter.* references, no patch needed."
            fi
          done

      # 8. Accept Android SDK licenses
      - name: Accept Android Licenses
        run: yes | flutter doctor --android-licenses || true

      # 9. Run analyzer (informational only — never blocks the build)
      - name: Analyze Code
        run: flutter analyze --no-fatal-infos --no-fatal-warnings || true

      # 10. Build release APK
      - name: Build Release APK
        run: flutter build apk --release

      # 11. Upload APK as downloadable artifact (kept 90 days)
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CityRevivalAG-Church-App-v${{ github.run_number }}
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 90

      # 12. Print APK size
      - name: Show APK Info
        run: |
          APK="build/app/outputs/flutter-apk/app-release.apk"
          if [ -f "$APK" ]; then
            SIZE=$(du -sh "$APK" | cut -f1)
            echo "APK built successfully — Size: $SIZE"
          else
            echo "APK file not found"
            exit 1
          fi

      # 13. Create GitHub Release for 1-Tap direct APK download on Android (No ZIP!)
      - name: Prepare APK for Direct Download
        run: cp build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/CityRevivalAG-Church.apk

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: City Revival AG App v1.0.${{ github.run_number }}
          body: |
            ### 📱 City Revival AG Church Official App
            **Release Build:** v1.0.${{ github.run_number }}

            #### 📥 1-Tap Direct Android Installation:
            Download **`CityRevivalAG-Church.apk`** below directly on your mobile browser (no ZIP, no Google Drive extraction required)!
          files: |
            build/app/outputs/flutter-apk/CityRevivalAG-Church.apk
