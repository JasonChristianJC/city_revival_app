name: Build City Revival AG Church APK

on:
  push:
    branches:
      - main
  workflow_dispatch:   # Also allows manual trigger from GitHub website

jobs:
  build-apk:
    name: Build Release APK
    runs-on: ubuntu-latest

    steps:
      # 1. Check out the code
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. Set up Java 17 (required by Android Gradle)
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # 3. Install Flutter (latest stable)
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: 'stable'
          cache: true

      # 4. Show Flutter & Dart version for logs
      - name: Flutter Version Info
        run: flutter --version

      # 5. Install all pub packages from pubspec.yaml
      - name: Install Dependencies (flutter pub get)
        run: flutter pub get

      # 6. Run Dart analyzer to catch code errors
      - name: Analyze Code
        run: flutter analyze --no-fatal-infos
        continue-on-error: true

      # 7. Build the release APK (unsigned — installable directly on Android phones)
      - name: Build Release APK
        run: |
          flutter build apk \
            --release \
            --no-shrink \
            --dart-define=FLUTTER_SUPPRESS_ANALYTICS=true

      # 8. Upload APK as a downloadable artifact (available for 90 days)
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CityRevivalAG-Church-App-v${{ github.run_number }}
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 90

      # 9. Also rename and show the file size in build logs
      - name: Show APK Info
        run: |
          APK_PATH="build/app/outputs/flutter-apk/app-release.apk"
          if [ -f "$APK_PATH" ]; then
            SIZE=$(du -sh "$APK_PATH" | cut -f1)
            echo "✅ APK built successfully!"
            echo "📦 File: app-release.apk"
            echo "📏 Size: $SIZE"
          else
            echo "❌ APK not found — build may have failed."
            exit 1
          fi
