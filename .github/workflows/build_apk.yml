name: Build City Revival AG Church APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-apk:
    name: Build Release APK
    runs-on: ubuntu-latest

    steps:
      # 1. Check out repository code
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. Set up Java 17 (required by Android Gradle plugin)
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # 3. Set up Flutter stable
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: 'stable'
          cache: true

      # 4. Set up Android SDK
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0'

      # 5. Write android/local.properties with correct SDK path
      - name: Create android/local.properties
        run: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" > android/local.properties
          echo "flutter.sdk=$(which flutter | sed 's|/bin/flutter||')" >> android/local.properties
          cat android/local.properties

      # 6. Confirm Flutter version
      - name: Flutter Version Info
        run: flutter --version

      # 7. Install pub dependencies (generates pubspec.lock fresh)
      - name: flutter pub get
        run: flutter pub get

      # 8. Accept Android SDK licenses
      - name: Accept Android Licenses
        run: yes | flutter doctor --android-licenses || true

      # 9. Run analyzer (non-blocking)
      - name: Analyze Code
        run: flutter analyze --no-fatal-infos
        continue-on-error: true

      # 10. Build release APK
      - name: Build Release APK
        run: flutter build apk --release

      # 11. Upload APK as downloadable artifact (kept 90 days)
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CityRevivalAG-Church-App-v${{ github.run_number }}
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 90

      # 12. Print APK size
      - name: Show APK Info
        run: |
          APK="build/app/outputs/flutter-apk/app-release.apk"
          if [ -f "$APK" ]; then
            SIZE=$(du -sh "$APK" | cut -f1)
            echo "APK built successfully — Size: $SIZE"
          else
            echo "APK file not found"
            exit 1
          fi
